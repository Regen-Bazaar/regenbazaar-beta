# Regen Bazaar beta — isolated stack for the shared HelpRent VPS.
# Everything is namespaced `regenbazaar_*` with its own bridge network and volume; nothing here
# touches HelpRent's containers/ports/nginx. The web port binds to 127.0.0.1 only — public traffic
# reaches it solely through the host nginx reverse proxy (see deploy/nginx/regenbazaar.conf.example).
#
# Run from this directory:  docker compose --env-file .env up -d --build
name: regenbazaar

services:
  postgres:
    image: postgres:16-alpine
    container_name: regenbazaar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - regenbazaar_pgdata:/var/lib/postgresql/data
    networks: [regenbazaar_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # No host port published — Postgres is reachable only inside regenbazaar_net.

  # One-shot: apply Drizzle migrations, then exit. web waits for this to complete.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    image: regenbazaar_build:latest
    container_name: regenbazaar_migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["pnpm", "--filter", "@rb/db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [regenbazaar_net]
    restart: "no"

  # Self-hosted IPFS node for tRWI metadata. RPC API (5001) stays INTERNAL to regenbazaar_net (never
  # published to the host); the gateway (8080) is exposed read-only via nginx. Config applied by the
  # init script at deploy/ipfs/001-config.sh.
  ipfs:
    image: ipfs/kubo:v0.30.0
    container_name: regenbazaar_ipfs
    environment:
      IPFS_PROFILE: server
    volumes:
      - regenbazaar_ipfs_data:/data/ipfs
      - ./ipfs/001-config.sh:/container-init.d/001-config.sh:ro
    networks: [regenbazaar_net]
    restart: unless-stopped
    # No host port for 5001 (RPC). Gateway 8080 reached via nginx only.

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    image: regenbazaar_web:latest
    container_name: regenbazaar_web
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # IPFS (self-host kubo) — RPC internal-only; gateway is the public read URL for resolving CIDs.
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-http://ipfs:8080}
      # On-chain (filled after W2 deploy). OPERATOR key is server-only — never in the browser bundle.
      CELO_SEPOLIA_RPC_URL: ${CELO_SEPOLIA_RPC_URL:-https://forno.celo-sepolia.celo-testnet.org}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}
    ports:
      # localhost-only bind; nginx on the host proxies the public subdomain to this.
      - "127.0.0.1:${WEB_PORT:-8010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ipfs:
        condition: service_started
    networks: [regenbazaar_net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # On-chain indexer (Ponder) — syncs contract events into Postgres (schema "indexer"); web reads them.
  indexer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    image: regenbazaar_build:latest
    container_name: regenbazaar_indexer
    command: ["pnpm", "--filter", "indexer", "start"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SCHEMA: indexer
      PONDER_RPC_URL_11142220: ${CELO_SEPOLIA_RPC_URL:-https://forno.celo-sepolia.celo-testnet.org}
      TRWI_ADDRESS: ${TRWI_ADDRESS}
      TRWI_START_BLOCK: ${TRWI_START_BLOCK}
      STAKING_ADDRESS: ${STAKING_ADDRESS}
      STAKING_START_BLOCK: ${STAKING_START_BLOCK}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [regenbazaar_net]
    restart: unless-stopped

networks:
  regenbazaar_net:
    name: regenbazaar_net
    driver: bridge

volumes:
  regenbazaar_pgdata:
    name: regenbazaar_pgdata
  regenbazaar_ipfs_data:
    name: regenbazaar_ipfs_data
